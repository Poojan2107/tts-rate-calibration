<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Baby Adult Protection Agency</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #000000;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, sans-serif;
            color: #161616;
            overflow: hidden;
        }

        /* 4:3 Ratio Viewport matching the reference mockup */
        .viewport-card {
            width: 1200px;
            height: 800px;
            background-color: #ECEBE8;
            position: relative;
            overflow: hidden;
            border-radius: 4px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.7);
        }

        /* Top Navigation */
        .nav-header {
            position: absolute;
            top: 40px;
            left: 56px;
            right: 56px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            z-index: 10;
        }

        .brand-group {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .pixel-heart {
            width: 22px;
            height: 20px;
            image-rendering: pixelated;
        }

        .brand-title {
            font-size: 13px;
            font-weight: 700;
            line-height: 1.2;
            letter-spacing: -0.01em;
            color: #161616;
        }

        .nav-links {
            display: flex;
            gap: 32px;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: #161616;
        }

        .nav-links a {
            color: #161616;
            text-decoration: none;
            transition: opacity 0.2s;
        }
        .nav-links a:hover {
            opacity: 0.6;
        }

        /* Hero Headline */
        .hero-title {
            position: absolute;
            top: 240px;
            left: 56px;
            font-size: 68px;
            font-weight: 700;
            line-height: 0.95;
            letter-spacing: -0.04em;
            color: #161616;
            z-index: 10;
            pointer-events: none;
        }

        /* Bottom Right Blurb */
        .bottom-blurb {
            position: absolute;
            bottom: 64px;
            right: 140px;
            max-width: 280px;
            font-size: 11.5px;
            line-height: 1.5;
            color: #D4D4D8;
            z-index: 10;
            font-weight: 500;
            pointer-events: none;
        }

        /* Interactive Canvas for the Pixelated Stepped Contour */
        #pixelCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
        }

        /* Custom Pixel Cursor */
        .custom-cursor {
            position: absolute;
            width: 20px;
            height: 24px;
            pointer-events: none;
            z-index: 20;
            transform: translate(2px, 2px);
            display: none;
        }
    </style>
</head>
<body>

    <div class="viewport-card">
        <!-- Top Nav -->
        <header class="nav-header">
            <div class="brand-group">
                <svg class="pixel-heart" viewBox="0 0 14 12" fill="#161616">
                    <rect x="2" y="0" width="3" height="2"/>
                    <rect x="9" y="0" width="3" height="2"/>
                    <rect x="1" y="2" width="5" height="2"/>
                    <rect x="8" y="2" width="5" height="2"/>
                    <rect x="0" y="4" width="14" height="2"/>
                    <rect x="1" y="6" width="12" height="2"/>
                    <rect x="3" y="8" width="8" height="2"/>
                    <rect x="5" y="10" width="4" height="2"/>
                </svg>
                <div class="brand-title">
                    Baby Adult<br>Protection Agency
                </div>
            </div>
            <nav class="nav-links">
                <a href="http://localhost:8501" target="_blank">Services</a>
                <a href="http://localhost:8501" target="_blank">About</a>
                <a href="http://localhost:8501" target="_blank">Contact</a>
            </nav>
        </header>

        <!-- Big Headline -->
        <h1 class="hero-title">
            Adulthood<br>is hard.
        </h1>

        <!-- Pixel Canvas -->
        <canvas id="pixelCanvas" width="1200" height="800"></canvas>

        <!-- Custom Cursor Arrow -->
        <svg class="custom-cursor" id="customCursor" viewBox="0 0 16 20" fill="none">
            <path d="M0 0V16L4.5 12L7.5 18L10 16.5L7 11H12.5L0 0Z" fill="#161616" stroke="#FFFFFF" stroke-width="1.5"/>
        </svg>

        <!-- Editorial Blurb -->
        <div class="bottom-blurb">
            Helping newbie adults (thirties or fifties... who cares) figure out how to navigate life and do a tiny bit better.
        </div>
    </div>

    <script>
        const canvas = document.getElementById('pixelCanvas');
        const ctx = canvas.getContext('2d');
        const customCursor = document.getElementById('customCursor');
        const card = document.querySelector('.viewport-card');

        const TILE = 24; // size of each pixel grid tile
        const COLS = Math.ceil(canvas.width / TILE);
        const ROWS = Math.ceil(canvas.height / TILE);

        // Precompute base contour separating top-left light from bottom-right dark
        // Organic stepped profile matching reference mockup
        const grid = [];
        for (let r = 0; r < ROWS; r++) {
            grid[r] = [];
            for (let c = 0; c < COLS; c++) {
                // Diagonal stepped barrier
                // Top-left is 0 (light), Bottom-right is 1 (dark)
                const threshold = 18 + (r * 1.3) + Math.sin(r * 0.4) * 4 + Math.sin(c * 0.2) * 2;
                grid[r][c] = c >= threshold ? 1 : 0;
            }
        }

        // Add interesting pixel protrusions / islands like in the reference image
        const protrusions = [
            [3, 21, 1], [4, 21, 1], [4, 22, 1], // top island
            [10, 20, 1], [11, 20, 1], [11, 21, 1],
            [15, 23, 1], [16, 23, 1], [16, 24, 1], [17, 24, 1],
            [23, 13, 1], [24, 13, 1], [25, 14, 1], [26, 14, 1],
            [27, 23, 1], [28, 23, 1], [29, 24, 1], [28, 25, 1]
        ];
        protrusions.forEach(([r, c, val]) => {
            if (r < ROWS && c < COLS) grid[r][c] = val;
        });

        // Track active blue hover square
        let hoverCell = { r: 15, c: 35 };

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Draw dark background tiles
            ctx.fillStyle = '#18181A';
            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    if (grid[r][c] === 1) {
                        ctx.fillRect(c * TILE, r * TILE, TILE, TILE);
                    }
                }
            }

            // Draw highlight blue cell
            if (hoverCell.r >= 0 && hoverCell.c >= 0 && grid[hoverCell.r][hoverCell.c] === 1) {
                ctx.fillStyle = '#1D3557';
                ctx.fillRect(hoverCell.c * TILE, hoverCell.r * TILE, TILE * 2, TILE * 2);
                ctx.fillStyle = '#2A4365';
                ctx.fillRect((hoverCell.c + 0.2) * TILE, (hoverCell.r + 0.2) * TILE, TILE * 1.6, TILE * 1.6);
            }

            // Draw Minesweeper proximity numbers on the light side near black tiles
            ctx.font = '500 10px "JetBrains Mono", monospace';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillStyle = '#71717A';

            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    if (grid[r][c] === 0) {
                        // Count neighboring black tiles
                        let neighbors = 0;
                        for (let dr = -1; dr <= 1; dr++) {
                            for (let dc = -1; dc <= 1; dc++) {
                                if (dr === 0 && dc === 0) continue;
                                const nr = r + dr, nc = c + dc;
                                if (nr >= 0 && nr < ROWS && nc >= 0 && nc < COLS && grid[nr][nc] === 1) {
                                    neighbors++;
                                }
                            }
                        }
                        // Draw numbers only near the boundary (neighbors 1 to 4)
                        if (neighbors > 0 && neighbors <= 4 && (r + c) % 2 === 0) {
                            ctx.fillText(neighbors, c * TILE + TILE / 2, r * TILE + TILE / 2);
                        }
                    }
                }
            }
        }

        draw();

        // Mouse hover interaction
        card.addEventListener('mousemove', (e) => {
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;

            const c = Math.floor(x / TILE);
            const r = Math.floor(y / TILE);

            customCursor.style.display = 'block';
            customCursor.style.left = `${x}px`;
            customCursor.style.top = `${y}px`;

            if (r >= 0 && r < ROWS && c >= 0 && c < COLS && grid[r][c] === 1) {
                hoverCell = { r, c };
                draw();
            }
        });

        card.addEventListener('mouseleave', () => {
            customCursor.style.display = 'none';
        });
    </script>
</body>
</html>
